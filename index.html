<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Hub</title>
<meta name="description" content="Lessons, cheat sheets, flashcards and scored quizzes, organised by subject.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--grad-1)"/><stop offset="1" style="stop-color:var(--grad-2)"/></linearGradient></defs>
</svg>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="home" aria-label="Back to subjects">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z" fill="currentColor"/><path d="M6 10.5V15c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
      <span class="brand-text">Study Hub</span>
    </button>
    <div class="crumbs" id="crumbs"></div>
    <div class="xp-chip" id="xp" title="Your study XP and daily streak"></div>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode">🌙</button>
  </div>
  <div class="read-progress" id="read-progress"></div>
</header>
<main class="wrap" id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>

<!-- Engine first, then one script per subject. To add a subject, add its file here. -->
<script src="app.js"></script>
<script src="subjects/iot/subject.js"></script>
<script src="subjects/iot/ch1.js"></script>
<script src="subjects/iot/ch2.js"></script>
<script src="subjects/iot/scenes.js"></script>
<script src="subjects/iot/visuals.js"></script>
<script src="subjects/arch/subject.js"></script>
<script src="subjects/arch/ch1.js"></script>
<script src="subjects/arch/ch2.js"></script>
<script src="subjects/arch/ch3.js"></script>
<script src="subjects/arch/scenes.js"></script>
<script src="subjects/arch/examples.js"></script>
<script src="subjects/arch/code.js"></script>
<script src="subjects/arch/visuals.js"></script>
<script src="subjects/devops/subject.js"></script>
<script src="subjects/devops/ch1.js"></script>
<script src="subjects/devops/ch2.js"></script>
<script src="subjects/devops/ch3.js"></script>
<script src="subjects/devops/ch4.js"></script>
<script src="subjects/devops/ch5.js"></script>
<script src="subjects/devops/scenes.js"></script>
<script src="subjects/devops/examples.js"></script>
<script src="subjects/devops/visuals.js"></script>
<!-- @chapters -->
</body>
</html>
